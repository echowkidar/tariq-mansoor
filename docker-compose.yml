version: "3.8"

services:
  tariq-portfolio-cms:
    build: .
    container_name: tariq-mansoor-portfolio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN:-tariqmansoor.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TariqMansoor@2026}
    volumes:
      - tariq_cms_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tariq-portfolio.rule=Host(`${DOMAIN:-tariqmansoor.com}`) || Host(`www.${DOMAIN:-tariqmansoor.com}`)"
      - "traefik.http.routers.tariq-portfolio.entrypoints=websecure"
      - "traefik.http.routers.tariq-portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.tariq-portfolio.loadbalancer.server.port=3000"

volumes:
  tariq_cms_data:
